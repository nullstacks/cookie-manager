<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Cookie Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- MAIN -->
  <section id="mainView" class="view">
    <header class="bar">
      <div class="mark" id="mark" data-icon="cookie"></div>
      <div class="ttl"><h1 id="host">Loading…</h1><p id="count"></p></div>
      <div class="bar-actions">
        <button id="btnAdd" class="icon-btn accent" title="Add cookie" aria-label="Add cookie" data-icon="plus"></button>
        <button id="btnSettings" class="icon-btn" title="Settings" aria-label="Settings" data-icon="settings"></button>
      </div>
    </header>

    <div class="tools">
      <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search name, value or domain" autocomplete="off" spellcheck="false" aria-label="Search cookies"></label>
    </div>

    <nav class="chips" id="filters" aria-label="Filter cookies">
      <button data-f="all" class="on">All<i></i></button><button data-f="session">Session<i></i></button><button data-f="persistent">Persistent<i></i></button><button data-f="secure">Secure<i></i></button><button data-f="httponly">HttpOnly<i></i></button>
    </nav>

    <div id="list"></div>

    <footer class="dock">
      <button id="btnImport" class="dk"><span data-icon="import"></span>Import</button>
      <button id="btnExport" class="dk"><span data-icon="export"></span>Export</button>
      <button id="btnDeleteAll" class="dk danger"><span data-icon="trash"></span><b>Delete all</b></button>
    </footer>

    <div id="exportMenu" class="menu hidden" role="menu">
      <div class="menu-title" id="menuTitle">Copy to clipboard as</div>
      <button data-fmt="json" role="menuitem"><b>JSON</b><span>Full detail, can be re-imported</span></button>
      <button data-fmt="header" role="menuitem"><b>Header string</b><span>name=value; name=value</span></button>
      <button data-fmt="netscape" role="menuitem"><b>Netscape</b><span>cookies.txt for curl, yt-dlp</span></button>
    </div>
  </section>

  <!-- IMPORT -->
  <section id="importView" class="view hidden">
    <header class="bar bar-center">
      <button class="back" aria-label="Back to cookies"><span data-icon="back"></span><span>Cookies</span></button>
      <h1>Import</h1>
      <span></span>
    </header>
    <div class="imp-body">
      <p class="hint">Paste <b>JSON</b>, a <b>header string</b> or a <b>Netscape</b> cookies.txt for <b id="impHost"></b>. The format is detected for you.</p>
      <textarea id="importText" spellcheck="false" aria-label="Cookies to import" placeholder='[{"name":"session","value":"abc123", ...}]

session=abc123; theme=dark

# Netscape HTTP Cookie File
.example.com	TRUE	/	FALSE	0	session	abc123'></textarea>
      <button id="btnDoImport" class="btn primary wide">Import cookies</button>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settingsView" class="view hidden">
    <header class="bar bar-center">
      <button class="back" aria-label="Back to cookies"><span data-icon="back"></span><span>Back</span></button>
      <h1>Settings</h1>
      <span></span>
    </header>
    <div class="set-body">
      <h2 class="glabel">Appearance</h2>
      <div class="group">
        <div class="srow"><span class="grow">Theme</span>
          <div class="seg" data-set="theme"><button data-v="auto">Auto</button><button data-v="dark">Dark</button><button data-v="light">Light</button></div></div>
        <div class="srow"><span class="grow">Accent</span><div class="swatches" id="swatches"></div></div>
        <label class="srow"><span class="grow">Show domain on each cookie<small>Helpful when a site sets cookies on subdomains</small></span>
          <input type="checkbox" class="sw" data-set="showDomain"></label>
      </div>

      <h2 class="glabel">Behavior</h2>
      <div class="group">
        <label class="srow"><span class="grow">Sort cookies by</span>
          <span class="selwrap"><select data-set="sort" aria-label="Sort cookies by"><option value="name">Name (A–Z)</option><option value="domain">Domain</option><option value="expiry">Expiry (soonest)</option><option value="size">Size (largest)</option></select><span data-icon="updown"></span></span></label>
        <div class="srow"><span class="grow">Export</span>
          <div class="seg" data-set="exportMode"><button data-v="copy">Copy</button><button data-v="file">Download</button></div></div>
        <label class="srow"><span class="grow">Confirm “Delete all”<small>Click twice to confirm. Undo always works</small></span>
          <input type="checkbox" class="sw" data-set="confirmDeleteAll"></label>
      </div>

      <div class="group gap"><button id="btnReset" class="srow action danger">Reset to defaults</button></div>
      <p class="footer">Saved automatically · <span id="about"></span></p>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
